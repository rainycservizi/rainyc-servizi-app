    return r.text().then(function (t) {
      var body = null;
      try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
      if (r.status === 401) throw new ApiError("auth", t("Sessione scaduta: accedere di nuovo."));
      if (r.status >= 500 || r.status === 429) throw new ApiError("network", (body && body.error) || t("Servizio non disponibile."));
      return { status: r.status, body: body };
    });
  });
}

/** Wire a login panel: elements #login, #login-email, #login-password, #login-err. Calls onReady() when signed in. */
function requireLogin(onReady) {
  var panel = document.getElementById("login");
  var email = document.getElementById("login-email");
  var pass = document.getElementById("login-password");
  var err = document.getElementById("login-err");
  function show() {
    panel.hidden = false;
    try { email.value = localStorage.getItem("rainyc.email") || ""; } catch (e) { /* ignore */ }
    (email.value ? pass : email).focus();
  }
  function done() { panel.hidden = true; onReady(); }
  panel.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.textContent = "";
    var b = panel.querySelector("button");
    b.disabled = true;
    login(email.value.trim(), pass.value).then(function (res) {
      b.disabled = false;
      if (!res.ok) { err.textContent = res.error; pass.focus(); pass.select(); return; }
      try { localStorage.setItem("rainyc.email", email.value.trim()); } catch (e) { /* ignore */ }
      pass.value = "";

    });
  });
  if (Session.get()) done(); else show();
  // Any later auth failure brings the panel back.
  document.addEventListener("rainyc:auth-lost", function () { if (panel.hidden) show(); });
}

/**
 * Change the signed-in user's password (Supabase Auth: PUT /auth/v1/user with the access token).
 * @returns {Promise<{ok:boolean, error?:string}>} error is Italian, ready to show.
 */
function changePassword(newPassword, retried) {
  var s = Session.get();
  if (!s) return Promise.resolve({ ok: false, error: t("Sessione scaduta: accedere di nuovo.") });
  var soon = (s.expires_at || 0) * 1000 - Date.now() < 60000;
  var ready = soon ? refreshSession() : Promise.resolve(true);
  return ready.then(function (ok) {
    var cur = Session.get();
    if (!ok || !cur) return { ok: false, error: t("Sessione scaduta: accedere di nuovo.") };
    return fetch(AUTH_URL + "/user", {
      method: "PUT",
      headers: { apikey: ANON_KEY, Authorization: "Bearer " + cur.access_token, "Content-Type": "application/json" },
      body: JSON.stringify({ password: newPassword })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return { ok: true };
        if (r.status === 401 && !retried) return refreshSession().then(function (ok2) { return ok2 ? changePassword(newPassword, true) : { ok: false, error: t("Sessione scaduta: accedere di nuovo.") }; });
        var code = b.error_code || b.code || "";
        if (code === "same_password") return { ok: false, error: t("La nuova password deve essere diversa da quella attuale.") };
        if (code === "weak_password") return { ok: false, error: t("Password troppo debole: sceglierne una piu lunga o meno comune.") };
        if (r.status === 401 || r.status === 403) return { ok: false, error: t("Sessione scaduta: accedere di nuovo.") };
        if (r.status === 429) return { ok: false, error: t("Troppi tentativi. Riprovare tra qualche minuto.") };
        return { ok: false, error: tf("Password non aggiornata ({0}). Riprovare.", r.status) };
      });
    }, function () { return { ok: false, error: t("Rete non raggiungibile.") }; });
  });
}

// ---- lib/week.js ----
// ISO week helpers. Plain JS so the same file runs in Deno (server) and, inlined by
// scripts/build_pages.mjs, in the browser pages. Dates are "YYYY-MM-DD" strings; all
// arithmetic is in UTC so the machine's time zone never shifts a day.

const DAY = 86400000;

/** @param {string} s @returns {number} ms since epoch at 00:00 UTC */
function utcOf(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) throw new Error("data non valida: " + s);
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}

/** @param {number} ms @returns {string} */
function isoDate(ms) {
  return new Date(ms).toISOString().slice(0, 10);
}

/** Monday = 0 … Sunday = 6. @param {number} ms */
function dow(ms) {
  return (new Date(ms).getUTCDay() + 6) % 7;
}

/** Monday of ISO week 1 of `year`, ms UTC. Jan 4 is always in week 1. */
function week1Monday(year) {
  const jan4 = Date.UTC(year, 0, 4);
  return jan4 - dow(jan4) * DAY;
}

/**
 * ISO week of a date.
 * @param {string} date "YYYY-MM-DD"
 * @returns {{year:number, week:number}}
 */
function isoWeekOf(date) {
  const d = utcOf(date);
  const thursday = d + (3 - dow(d)) * DAY;
  const year = new Date(thursday).getUTCFullYear();
  const week = Math.floor((thursday - Date.UTC(year, 0, 1)) / DAY / 7) + 1;
  return { year, week };
}

/** 52 or 53. @param {number} year */
function weeksInYear(year) {
  return isoWeekOf(year + "-12-28").week;
}

/**
 * Parse "2026-W41" (also "2026-W5", "2026-w41").
 * @param {string} text
 * @returns {{year:number, week:number}|null} null when malformed or out of range
 */
function parseWeek(text) {
  const m = /^\s*(\d{4})-[Ww](\d{1,2})\s*$/.exec(text || "");
  if (!m) return null;
  const year = +m[1];
  const week = +m[2];
  if (year < 2020 || year > 2100) return null;
  if (week < 1 || week > weeksInYear(year)) return null;
  return { year, week };
}

/** @param {{year:number, week:number}} w @returns {string} "2026-W41" */
function formatWeek(w) {
  return w.year + "-W" + String(w.week).padStart(2, "0");
}

/** The seven dates of an ISO week, Monday first. @param {{year:number, week:number}} w */
function weekDays(w) {
  const monday = week1Monday(w.year) + (w.week - 1) * 7 * DAY;
  const out = [];
  for (let i = 0; i < 7; i++) out.push(isoDate(monday + i * DAY));
  return out;
}

/** @param {{year:number, week:number}} w @param {number} delta @returns {{year:number, week:number}} */
function shiftWeek(w, delta) {
  const monday = week1Monday(w.year) + (w.week - 1) * 7 * DAY;
  return isoWeekOf(isoDate(monday + delta * 7 * DAY));
}

/** Today's date in New York as "YYYY-MM-DD". */
function todayNewYork(now) {
  const d = now || new Date();
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(d);
  const get = (t) => parts.find((p) => p.type === t).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}

const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
  "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const GIORNI = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];

/** "Lunedì 5 ottobre 2026" @param {string} date */
function fmtDay(date) {
  const ms = utcOf(date);
  const d = new Date(ms);
  return GIORNI[dow(ms)] + " " + d.getUTCDate() + " " + MESI[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

/** "5–11 ottobre 2026" / "28 settembre – 4 ottobre 2026" / across years. */
function fmtRange(a, b) {
  const da = new Date(utcOf(a)), db = new Date(utcOf(b));
  const ya = da.getUTCFullYear(), yb = db.getUTCFullYear();
  const ma = da.getUTCMonth(), mb = db.getUTCMonth();
  if (ya !== yb) return da.getUTCDate() + " " + MESI[ma] + " " + ya + " – " + db.getUTCDate() + " " + MESI[mb] + " " + yb;
  if (ma !== mb) return da.getUTCDate() + " " + MESI[ma] + " – " + db.getUTCDate() + " " + MESI[mb] + " " + yb;
  return da.getUTCDate() + "–" + db.getUTCDate() + " " + MESI[ma] + " " + ya;
}

// Monthly page and Top Sheet (the report Rome receives at month end). Plain JS: Deno tests, the function and
// (inlined) the browser page share it. The numbers come from public.v_monthly_topsheet (one row per month,
// voided rows excluded); the page never recomputes them. Gennaio–Luglio 2026 are the figures already sent to
// Rome, frozen on Marco's word (2026-10-15: "we start in August, the rest is history").

/** Keys: video radio live | tg1 tg2 tg3 rnews altre tot_video | gr1 gr2 gr3 tot_radio (tappeti were not reported). */
const LEGACY_TOPSHEET = {
  "2026-01": { video: 253, radio: 123, live: 255, tg1: 167, tg2: 123, tg3: 83, rnews: 113, altre: 7, tot_video: 493, gr1: 123, gr2: 126, gr3: 126, tot_radio: 375 },
  "2026-02": { video: 150, radio: 52, live: 168, tg1: 98, tg2: 82, tg3: 72, rnews: 58, altre: 6, tot_video: 316, gr1: 52, gr2: 52, gr3: 52, tot_radio: 156 },
  "2026-03": { video: 196, radio: 62, live: 270, tg1: 137, tg2: 117, tg3: 97, rnews: 104, altre: 11, tot_video: 466, gr1: 62, gr2: 62, gr3: 62, tot_radio: 186 },
  "2026-04": { video: 212, radio: 88, live: 283, tg1: 153, tg2: 112, tg3: 88, rnews: 124, altre: 4, tot_video: 481, gr1: 88, gr2: 88, gr3: 88, tot_radio: 264 },
  "2026-05": { video: 200, radio: 50, live: 204, tg1: 133, tg2: 93, tg3: 73, rnews: 93, altre: 6, tot_video: 398, gr1: 50, gr2: 50, gr3: 50, tot_radio: 150 },
  "2026-06": { video: 191, radio: 69, live: 201, tg1: 128, tg2: 101, tg3: 66, rnews: 77, altre: 10, tot_video: 382, gr1: 69, gr2: 69, gr3: 69, tot_radio: 207 },
  "2026-07": { video: 224, radio: 62, live: 214, tg1: 142, tg2: 114, tg3: 71, rnews: 88, altre: 0, tot_video: 415, gr1: 62, gr2: 62, gr3: 62, tot_radio: 186 },
};
/** Top Sheet columns in Rome's order: [key, heading]. */
const TOPSHEET_COLS = [
  ["video", "Servizi video"], ["radio", "Servizi radio"], ["live", "Live"], ["tappeti", "Tappeti"],
  ["tg1", "TG1"], ["tg2", "TG2"], ["tg3", "TG3"], ["rnews", "RNEWS 24"], ["altre", "ALTRE"], ["tot_video", "Totale video"],
  ["gr1", "Radio GR 1"], ["gr2", "Radio GR 2"], ["gr3", "Radio GR 3"], ["tot_radio", "Totale radio"],
];
const KEYS = TOPSHEET_COLS.map((c) => c[0]);

/** "2026-10" -> {year, month} | null */
function parseMonth(text) {
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(text || "").trim());
  if (!m) return null;
  const year = Number(m[1]), month = Number(m[2]);
  if (year < 2000 || year > 2100 || month < 1 || month > 12) return null;
  return { year, month };
}
function formatMonth(m) { return `${m.year}-${String(m.month).padStart(2, "0")}`; }
function shiftMonth(m, delta) {
  const n = m.year * 12 + (m.month - 1) + delta;
  return { year: Math.floor(n / 12), month: (n % 12) + 1 };
}
/** First and last day of the month, "YYYY-MM-DD". */
function monthRange(m) {
  const last = new Date(Date.UTC(m.year, m.month, 0)).getUTCDate();
  return { from: `${formatMonth(m)}-01`, to: `${formatMonth(m)}-${String(last).padStart(2, "0")}` };
}
/** "Ottobre 2026" */
function monthLabel(m) { const n = MESI[m.month - 1]; return n.charAt(0).toUpperCase() + n.slice(1) + " " + m.year; }
function monthOf(date) { return { year: Number(date.slice(0, 4)), month: Number(date.slice(5, 7)) }; }

/**
 * One Top Sheet row from a v_monthly_topsheet row. Legacy convention kept: the radio count goes to GR 1, 2 and 3
 * alike (the database has one rete "GR"); Totale radio = three times the radio count.
 */
function topsheetRow(v) {
  const radio = Number(v.radio || 0);
  return {
    ym: String(v.anno_mese), source: "db",
    video: Number(v.pezzi || 0), radio, live: Number(v.live || 0), tappeti: Number(v.tappeti || 0),
    tg1: Number(v.tg1 || 0), tg2: Number(v.tg2 || 0), tg3: Number(v.tg3 || 0), rnews: Number(v.ran || 0), altre: Number(v.altre || 0),
    tot_video: Number(v.totale_video || 0), gr1: radio, gr2: radio, gr3: radio, tot_radio: radio * 3,
  };
}
function emptyRow(ym, source) {
  const r = { ym, source };
  for (const k of KEYS) r[k] = 0;
  return r;
}
/**
 * The year's Top Sheet: twelve rows (frozen legacy figures win over the database; months without rows are zeros)
 * plus a "Totale" row. `viewRows` = v_monthly_topsheet rows of that year.
 * @param {Array<Record<string, unknown>>} viewRows @param {number} year
 */
function yearTable(viewRows, year) {
  const byYm = new Map((viewRows || []).map((v) => [String(v.anno_mese), v]));
  const rows = [];
  for (let month = 1; month <= 12; month++) {
    const ym = formatMonth({ year, month });
    const legacy = LEGACY_TOPSHEET[ym];
    let r;
    if (legacy) { r = emptyRow(ym, "storico"); for (const k of KEYS) if (k in legacy) r[k] = legacy[k]; r.tappeti = null; }
    else if (byYm.has(ym)) r = topsheetRow(byYm.get(ym));
    else r = emptyRow(ym, "vuoto");
    r.mese = monthLabel({ year, month });
    rows.push(r);
  }
  const tot = emptyRow(`${year}`, "totale"); tot.mese = `Totale ${year}`;
  for (const k of KEYS) tot[k] = rows.reduce((a, r) => a + (r[k] == null ? 0 : r[k]), 0);
  return { rows, total: tot };
}

const CATS = ["pezzo", "radio", "live", "tappeto"];
function bucket() { return { pezzi: 0, radio: 0, live: 0, tappeti: 0, trasferte: 0, righe: 0 }; }
function add(b, r) {
  b.righe += 1;
  const c = String(r.categoria || "");
  if (c === "pezzo") b.pezzi += 1; else if (c === "radio") b.radio += 1; else if (c === "live") b.live += 1; else if (c === "tappeto") b.tappeti += 1;
  if (r.trasferta === true) b.trasferte += 1;
}
/**
 * The ISO weeks that touch the month, with the month's rows counted per week (rows outside the month belong to
 * the neighbouring month's page). `rows` = v_weekly_collaudo rows with data inside the month.
 */
function weeksOf(rows, m) {
  const { from, to } = monthRange(m);
  const weeks = new Map();
  for (let d = new Date(from + "T00:00:00Z"); d.toISOString().slice(0, 10) <= to; d.setUTCDate(d.getUTCDate() + 1)) {
    const w = isoWeekOf(d.toISOString().slice(0, 10));
    const key = formatWeek(w);
    if (!weeks.has(key)) { const days = weekDays(w); weeks.set(key, Object.assign({ week: key, from: days[0], to: days[6] }, bucket())); }
  }
  for (const r of rows || []) {
    const key = formatWeek(isoWeekOf(String(r.data)));
    if (weeks.has(key)) add(weeks.get(key), r);
  }
  return Array.from(weeks.values());
}
/** Per journalist, most rows first. */
function journalistsOf(rows) {
  const by = new Map();
  for (const r of rows || []) {
    const name = String(r.giornalista || "?");
    if (!by.has(name)) by.set(name, Object.assign({ giornalista: name }, bucket()));
    add(by.get(name), r);
  }
  return Array.from(by.values()).sort((a, b) => b.righe - a.righe || a.giornalista.localeCompare(b.giornalista));
}

(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var current = null, data = null, loadedOnce = false;
  $("lnk-form").href = PAGE_FORM; $("lnk-collaudo").href = PAGE_COLLAUDO; $("lnk-mensile").href = PAGE_MENSILE; $("lnk-gestione").href = PAGE_GESTIONE;
  initTheme("theme"); initLang("lang");
  function setMsg(text, isErr) { var m = $("msg"); m.textContent = text; m.className = isErr ? "err" : "msg"; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  // Headings: English on screen when chosen, always Italian in print (Rome's columns).
  function hd(it) { var en = t(it); return en === it ? esc(it) : '<span class="scr">' + esc(en) + '</span><span class="prn">' + esc(it) + "</span>"; }
  function n(v) { return v == null ? "–" : String(v); }
  function render() {
    var m = current, y = data.year, ym = formatMonth(m);
    var groupA = ["video", "radio", "live", "tappeti"], groupB = ["tg1", "tg2", "tg3", "rnews", "altre", "tot_video"], groupC = ["gr1", "gr2", "gr3", "tot_radio"];
    var label = {}; TOPSHEET_COLS.forEach(function (c) { label[c[0]] = c[1]; });
    var th = function (keys, cls) { return keys.map(function (k, i) { return "<th" + (cls && i === 0 ? ' class="grpa"' : "") + ">" + hd(label[k]) + "</th>"; }).join(""); };
    var td = function (r, keys, cls) { return keys.map(function (k, i) { return "<td" + (cls && i === 0 ? ' class="grpa"' : "") + ">" + n(r[k]) + "</td>"; }).join(""); };
    var rows = y.rows.map(function (r) {
      return '<tr data-ym="' + esc(r.ym) + '" tabindex="0" class="' + (r.ym === ym ? "sel" : "") + '"><td>' + esc(r.mese) + "</td>" + td(r, groupA) + td(r, groupB, true) + td(r, groupC, true) +
        '<td class="src ' + r.source + '">' + esc(t(r.source === "storico" ? "inviato" : r.source === "db" ? "dal database" : "")) + "</td></tr>";
    }).join("");
    var tot = y.total;
    var top = "<thead><tr><th>" + hd("Mese") + "</th>" + th(groupA) + th(groupB, true) + th(groupC, true) + "<th></th></tr></thead><tbody>" + rows +
      '<tr class="tot"><td>' + esc(tot.mese) + "</td>" + td(tot, groupA) + td(tot, groupB, true) + td(tot, groupC, true) + "<td></td></tr></tbody>";
    var weeks = data.weeks.map(function (w) {
      var href = PAGE_COLLAUDO + (PAGE_COLLAUDO.indexOf("?") >= 0 ? "&" : "?") + "week=" + w.week;
      return "<tr><td><a href=\"" + esc(href) + "\">" + esc(w.week) + "</a> <span class=\"scr\" style=\"color:var(--dim)\">" + esc(fmtRange(w.from, w.to)) + "</span></td><td>" + w.pezzi + "</td><td>" + w.radio + "</td><td>" + w.live + "</td><td>" + w.tappeti + "</td><td>" + w.trasferte + "</td><td>" + w.righe + "</td></tr>";
    }).join("");
    var jour = data.journalists.map(function (j) {
      return "<tr><td>" + esc(j.giornalista) + "</td><td>" + j.pezzi + "</td><td>" + j.radio + "</td><td>" + j.live + "</td><td>" + j.tappeti + "</td><td>" + j.trasferte + "</td><td>" + j.righe + "</td></tr>";
    }).join("");
    var small = "<thead><tr><th>{0}</th><th>" + hd("Pezzi") + "</th><th>" + hd("Radio") + "</th><th>" + hd("Live") + "</th><th>" + hd("Tappeti") + "</th><th>" + hd("Trasferte") + "</th><th>" + hd("Totale") + "</th></tr></thead>";
    $("doc").innerHTML =
      '<header class="doc"><div class="ente">RAI – ' + esc(t("Sede di corrispondenza di New York")) + '</div><h1>' + esc(t("Report mensile")) + " · " + esc(monthLabel(m)) + '</h1><div class="sett">' +
      esc(tf("Top Sheet {0}: cifre di Gennaio–Luglio come inviate a Roma; da Agosto dal database (registrazioni annullate escluse). GR 1, 2, 3 ripetono il conteggio radio, come nel foglio.", m.year)) + "</div></header>" +
      '<h2 class="sec">' + esc(t("Top Sheet")) + " " + m.year + '<span class="aside">' + esc(t("il prospetto per Roma")) + '</span></h2><div class="table-wrap"><table>' + top + "</table></div>" +
      '<div class="two"><div><h2 class="sec">' + esc(t("Settimane del mese")) + '<span class="aside">' + esc(tf("{0} registrazioni nel mese", data.rows)) + '</span></h2><div class="table-wrap"><table>' + small.replace("{0}", hd("Settimana")) + "<tbody>" + (weeks || '<tr><td colspan="7">' + esc(t("Nessuna registrazione")) + "</td></tr>") + "</tbody></table></div></div>" +
      '<div><h2 class="sec">' + esc(t("Giornalisti")) + '</h2><div class="table-wrap"><table>' + small.replace("{0}", hd("Giornalista")) + "<tbody>" + (jour || '<tr><td colspan="7">' + esc(t("Nessuna registrazione")) + "</td></tr>") + "</tbody></table></div></div></div>" +
      '<footer class="doc">' + esc(tf("Generato il {0} dal sistema RAI NYC Servizi · fonte: database", todayNewYork())) + '<span class="scr"> · built by Caruso</span></footer>';
  }
  function load(m) {

  // A click (or Enter) on a month row of the Top Sheet opens that month.
  function rowMonth(ev) { var tr = ev.target && ev.target.closest ? ev.target.closest("tr[data-ym]") : null; return tr ? parseMonth(tr.getAttribute("data-ym")) : null; }
  $("doc").addEventListener("click", function (ev) { var m = rowMonth(ev); if (m) load(m); });

  var mail = mountMail({
    button: $("email"), route: "/api/email-topsheet",
    body: function () { return current ? { month: formatMonth(current) } : null; },
    label: function () { return current ? monthLabel(current) : ""; },
    lead: function (l) { return tf("Il Top Sheet {0} (il prospetto dell'anno con il mese evidenziato, colonne di Roma) parte dalla casella della redazione. Scegliere i destinatari.", l); },
    done: function (l, sent) { setMsg(tf("Top Sheet {0} inviato a {1} destinatari.", l, sent.length)); }
  });
  document.addEventListener("rainyc:lang", function () { if (data) render(); mail.refresh(); });
  requireLogin(function () {
    $("tools").hidden = false;
    mountPassword($("hright")); mountLogout($("hright")); mail.load();
    var m = parseMonth(new URLSearchParams(location.search).get("month") || "") || monthOf(todayNewYork());
    load(m);
  });
  document.addEventListener("rainyc:auth-lost", function () { $("doc").innerHTML = ""; data = null; loadedOnce = false; $("tools").hidden = true; });
})();
