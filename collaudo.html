<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RAI NYC Servizi · Collaudo</title>
<script>(function () { var t = null; try { t = localStorage.getItem("rainyc.tema"); } catch (e) { /* blocked */ } if (t !== "light" && t !== "dark") { try { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; } } document.documentElement.setAttribute("data-theme", t); })();</script>
<style>
/* Same tokens as form.html (visual language borrowed from Crop Studio). Print is always light. */
:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --bg:#f3f1ed; --panel:#ffffff; --raise:#f7f5f2; --input:#ffffff; --hover:#efece7; --line:#e0dcd5; --line2:#c9c3b9;
  --fg:#1b1a1c; --dim:#666159; --accent:#e85d04; --accent-ink:#140a03; --accent-text:#b04400; --accent-soft:#fdeee3;
  --ok:#1d6b3a; --ok-bg:#e5f2e9; --warn:#8a5a00; --warn-bg:#fcf1d8; --bad:#b3261e; --bad-bg:#fbe8e5;
  --focus:#c24e00; --shadow:0 1px 2px rgba(40,30,20,.06), 0 4px 14px rgba(40,30,20,.05); --pop:0 10px 30px rgba(30,20,10,.18);
  --zebra:#faf8f5; --band:#f0ece6; --rule:#1b1a1c; --red:#b3261e;
}
:root[data-theme=dark] {
  --bg:#111012; --panel:#171619; --raise:#1e1d21; --input:#0d0c0f; --hover:#232227; --line:#2a292e; --line2:#3a3940;
  --fg:#f0eeea; --dim:#9a958e; --accent:#e85d04; --accent-ink:#140a03; --accent-text:#ff8a3d; --accent-soft:#2a1a10;
  --ok:#6fd39b; --ok-bg:#12241a; --warn:#e9b44c; --warn-bg:#2a2210; --bad:#ff7b66; --bad-bg:#2c1613;
  --focus:#ff8a3d; --shadow:0 1px 0 rgba(0,0,0,.35); --pop:0 14px 40px rgba(0,0,0,.6);
  --zebra:#1b1a1e; --band:#222126; --rule:#5a5860; --red:#ff7b66;
}
:root { color-scheme:light; } :root[data-theme=dark] { color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); }
body { font:14px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

/* ── header + tools (one sticky block) ── */
.top { position:sticky; top:0; z-index:20; }
.appbar { height:52px; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:baseline; gap:10px; min-width:0; overflow:hidden; }
.brand .mk { font:700 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--accent-text); }
.brand .nm { font-weight:650; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.brand .pg { font:600 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.hright { margin-left:auto; display:flex; align-items:center; gap:6px; }
.hlink { display:inline-flex; align-items:center; height:36px; padding:0 12px; border-radius:6px; font-size:14px; color:var(--dim); text-decoration:none; white-space:nowrap; }
.hlink:hover { color:var(--fg); background:var(--hover); }
.hlink.go { color:var(--fg); border:1px solid var(--line2); }
.hlink.go:hover { border-color:var(--accent); color:var(--accent-text); background:transparent; }
.icbtn { width:36px; height:36px; display:inline-grid; place-items:center; border:1px solid var(--line2); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; padding:0; }
.icbtn:hover { border-color:var(--accent); color:var(--accent-text); }
.icbtn svg { width:18px; height:18px; }
:root[data-theme=dark] .ic-moon, :root:not([data-theme=dark]) .ic-sun { display:none; }

.tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 16px; margin:0; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent); border-bottom:1px solid var(--line); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.tools .grp { display:flex; align-items:center; gap:6px; }
.tools .sep { width:1px; height:24px; background:var(--line2); margin:0 4px; }
.tools label.wk { display:flex; align-items:center; gap:8px; font:600 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.tools input[type=text] { width:8.5em; height:36px; font:600 14px/1 var(--mono); padding:0 10px; border:1px solid var(--line2); border-radius:6px; background:var(--input); color:var(--fg); }
.tools .msg { color:var(--dim); font-size:13px; margin-left:auto; }
.tools .err { color:var(--bad); font-weight:600; font-size:13px; margin-left:auto; }
.btn { height:36px; padding:0 12px; font:inherit; font-size:14px; font-weight:600; border-radius:6px; border:1px solid var(--line2); background:var(--raise); color:var(--fg); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
.btn:hover { border-color:var(--dim); }
.btn:disabled { opacity:.45; cursor:default; }
.btn.pri { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
.btn.pri:hover { filter:brightness(1.07); }
.btn.sq { width:36px; padding:0; justify-content:center; }
.btn svg { width:16px; height:16px; }
input:focus-visible, select:focus-visible { outline:none; border-color:var(--focus) !important; box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 28%, transparent); }

/* ── login, states ── */
.page { padding:16px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }
.ph { font:600 11px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin:0 0 14px; }
#login { max-width:400px; margin:9vh auto 0; padding:16px 16px 18px; font-size:15px; }
#login .lead { margin:0 0 16px; color:var(--dim); font-size:14px; }
#login label { display:block; font-weight:600; font-size:13px; margin:0 0 6px; }
#login .hint { font-weight:400; color:var(--dim); font-size:12px; }
#login input, .fld input, .fld select { width:100%; height:44px; font:inherit; font-size:16px; padding:0 12px; border:1px solid var(--line2); border-radius:6px; background:var(--input); color:var(--fg); margin:0 0 12px; }
#login button { width:100%; height:48px; justify-content:center; font-size:15px; }
#login .err, .pop .err { color:var(--bad); margin-top:8px; font-weight:600; font-size:13px; }
.pop .msg { color:var(--ok); margin-top:8px; font-weight:600; font-size:13px; }
.pop .msg:empty { display:none; }
.err:empty { display:none; }
.state { padding:48px 24px; text-align:center; color:var(--dim); font-size:15px; }
.state.ko { color:var(--bad); font-weight:600; }
.state .btn { margin-top:14px; }
#doc.busy { opacity:.55; transition:opacity .15s; pointer-events:none; }

/* ── the collaudo sheet ── */
.sheet { padding:18px 22px 22px; max-width:1500px; margin:0 auto; }
.sheet:empty { display:none; }
.sheet { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:24px; }
.sheet > * { grid-column:1 / -1; }
.sheet > header.doc { grid-column:1; margin-bottom:14px; }
.sheet > .counters { grid-column:2; align-self:end; margin-bottom:14px; }
.dochead { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; margin:0 0 14px; }
header.doc { padding:0; margin:0; }
header.doc .ente { font:600 11px/1.2 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
header.doc h1 { font-size:22px; margin:6px 0 2px; font-weight:700; letter-spacing:-.01em; }
header.doc .sett { font-size:14px; color:var(--dim); }
.counters { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line2); border-radius:6px; margin:0; overflow:hidden; background:var(--raise); }
.counters .grp { display:flex; flex-wrap:wrap; }
.counters .grp + .grp { border-left:1px solid var(--line2); }
.counters .c { padding:6px 10px; text-align:center; min-width:58px; }
.counters .c + .c { border-left:1px solid var(--line); }
.counters .n { font:700 17px/1.2 var(--mono); font-variant-numeric:tabular-nums; display:block; }
.counters .l { font-size:10.5px; color:var(--dim); white-space:nowrap; }
.counters .tot .n { color:var(--accent-text); }

table { width:100%; border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums; font-size:13.5px; }
thead th { position:sticky; top:var(--toph, 0px); z-index:5; background:var(--panel); text-align:left; font:600 10.5px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--dim);
  border-top:1px solid var(--line2); border-bottom:1.5px solid var(--rule); padding:9px 8px; white-space:nowrap; }
td { padding:7px 8px; line-height:20px; border-bottom:1px solid var(--line); vertical-align:top; }
tbody tr.r:nth-of-type(even) td { background:var(--zebra); }
tbody tr.r:hover td { background:var(--hover); }
th.k, td.k { text-align:center; width:3.6em; }
td.k { font-weight:700; }
td.k.tcell { width:auto; min-width:4.2em; }
tr.day td { background:var(--band); border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); padding:0 8px 0 0; }
button.dt { all:unset; box-sizing:border-box; display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:0 10px 0 8px; font-weight:700; font-size:13.5px; cursor:pointer; border-radius:4px; color:var(--fg); }
button.dt:hover { color:var(--accent-text); }
button.dt:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
button.dt .chev { transition:transform .15s; color:var(--dim); flex:none; }
button.dt[aria-expanded=false] .chev { transform:rotate(-90deg); }
.dn { font:700 11px/1 var(--mono); color:var(--dim); background:var(--panel); border:1px solid var(--line2); border-radius:999px; padding:3px 7px; }
tr.day .trip { font-weight:600; color:var(--red); margin-left:6px; font-size:13px; }
tr.tot td { text-align:right; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--line2); background:var(--panel); padding-top:5px; padding-bottom:5px; }
tr.tot td.k { text-align:center; color:var(--fg); }
tr.empty td { color:var(--dim); font-style:italic; font-size:12.5px; padding-top:5px; padding-bottom:5px; }
tbody.dg.chiuso tr.r, tbody.dg.chiuso tr.empty { display:none; }
.si { color:var(--red); font-weight:800; }
.tn { display:block; font-size:11px; font-weight:500; color:var(--dim); white-space:nowrap; line-height:14px; }
.prn { display:none; }
td.ed { cursor:text; }
td.ed:hover { box-shadow:inset 0 0 0 1px var(--line2); }
td.ed.saving { opacity:.5; }
td.ed .edin { width:100%; min-width:6em; height:30px; font:inherit; padding:2px 6px; border:1px solid var(--focus); border-radius:4px; background:var(--input); color:var(--fg); }
td.act { white-space:nowrap; text-align:right; width:1%; padding-top:4px; padding-bottom:4px; }
button.ic { border:0; background:transparent; color:var(--dim); width:28px; height:28px; line-height:1; padding:0; cursor:pointer; border-radius:4px; font-size:14px; }
button.ic:hover, button.ic:focus-visible { background:var(--raise); color:var(--fg); }
button.ic[data-act=void]:hover { color:var(--bad); }
.rowerr { display:block; color:var(--bad); font-weight:600; font-size:12px; white-space:normal; text-align:right; }
.rowerr:empty { display:none; }
.nowrap { white-space:nowrap; }
footer.doc { margin-top:22px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
footer.doc .gen { font-size:11px; color:var(--dim); }
footer.doc .firma { font-size:13px; white-space:nowrap; }

/* ── trasferta popover ── */
.pop { position:fixed; z-index:40; width:360px; max-width:calc(100vw - 24px); background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:var(--pop); padding:14px 16px 16px; font-size:14px; }
.pop .fld label { display:block; font-weight:600; font-size:13px; margin:0 0 6px; }
.pop .row2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.pop .row2 > * { min-width:0; }
.pop input[type=date] { font-size:15px; padding:0 8px; }
.pop .row { display:flex; gap:8px; margin-top:4px; }
.pop .row .btn { flex:1; justify-content:center; height:40px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:0 0 14px; }
.seg label { position:relative; }
.seg input { position:absolute; opacity:0; inset:0; margin:0; }
.seg span { display:flex; align-items:center; justify-content:center; height:40px; border:1px solid var(--line2); border-radius:6px; background:var(--raise); font-weight:600; cursor:pointer; }
.seg input:checked + span { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.seg input:focus-visible + span { outline:2px solid var(--focus); outline-offset:2px; }
/* ── e-mail: recipients to tick, one to add ── */
.pop.mail { width:440px; top:70px; left:50%; transform:translateX(-50%); }
.rcp { list-style:none; margin:0 0 10px; padding:0; max-height:min(40vh, 320px); overflow:auto; border:1px solid var(--line); border-radius:6px; }
.rcp li { display:flex; align-items:center; gap:10px; min-height:40px; padding:0 10px; border-bottom:1px solid var(--line); }
.rcp li:last-child { border-bottom:0; }
.rcp label { flex:1; display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rcp input[type=checkbox] { width:18px; height:18px; margin:0; accent-color:var(--accent); flex:none; }
.rcp .rm { all:unset; cursor:pointer; color:var(--dim); font-size:16px; padding:4px 6px; border-radius:4px; } .rcp .rm:hover { color:var(--bad); background:var(--raise); }
.addr { display:flex; gap:6px; margin:0 0 4px; } .addr input { flex:1; min-width:0; height:40px; margin:0; font-size:15px; } .addr .btn { height:40px; }
.pop-pwd { position:absolute; top:58px; right:16px; z-index:40; width:340px; max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:var(--pop); padding:14px 16px 16px; }
.pop-pwd .fld label { display:block; font-weight:600; font-size:13px; margin:0 0 6px; }
.pop-pwd .hint { font-weight:400; color:var(--dim); font-size:12px; }
.pop-pwd .row { display:flex; gap:8px; }
.pop-pwd .row .btn { flex:1; justify-content:center; height:40px; }
.pwd-msg { font-size:13px; margin:10px 0 0; font-weight:600; }
.pwd-msg:empty { display:none; }
.pwd-msg.ok { color:var(--ok); } .pwd-msg.ko { color:var(--bad); }

/* Below 1200px the 15 columns no longer fit: the table scrolls sideways inside the sheet, not the page. */
@media screen and (max-width:1199.98px) { .table-wrap { overflow-x:auto; } thead th { position:static; } td[data-f="subject"] { min-width:15em; } td[data-f="richiedente"] { min-width:8em; } .sheet > header.doc, .sheet > .counters { grid-column:1 / -1; } .sheet > .counters { justify-self:start; } }
@media screen and (max-width:760px) {
  .page { padding:10px; } .sheet { padding:14px; }
  .brand .pg, .brand .mk { display:none; } .appbar { padding:0 10px; gap:8px; } .tools { padding:8px 10px; }
  .tools .msg, .tools .err { margin-left:0; flex-basis:100%; }
  .btn .tx { display:none; } .tools .sep { display:none; } .hlink { padding:0 8px; font-size:13px; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

/* ── print: always light, every day expanded, Rome's columns only ── */
@page { size: A4 landscape; margin: 12mm; }
@media print {
  :root, :root[data-theme=dark] {
    --bg:#fff; --panel:#fff; --raise:#fff; --fg:#111; --dim:#555; --line:#e6e6e6; --line2:#bbb; --rule:#111;
    --zebra:#f4f4f4; --band:#e2e2e2; --red:#c00000; --accent-text:#111;
  }
  :root, :root[data-theme=dark] { color-scheme:light; }
  html, body { background:#fff; color:#111; }
  body { font-size:11px; }
  .top, .tools, .np, .pop, .pop-pwd, #login { display:none !important; }
  .page { padding:0; }
  .panel { border:0; box-shadow:none; border-radius:0; }
  .sheet { max-width:none; padding:0; display:block; }
  header.doc { margin-bottom:10px; } .counters { margin-bottom:12px; width:max-content; max-width:100%; }
  .scr, .chev { display:none !important; } .prn { display:inline; }
  tbody.dg.chiuso tr.r, tbody.dg.chiuso tr.empty { display:table-row !important; }
  button.dt { min-height:0; padding:0; font-size:inherit; }
  .counters { border-radius:0; border-color:#111; background:#fff; }
  .counters .grp + .grp { border-left-color:#111; } .counters .c + .c { border-left-color:#bbb; }
  header.doc h1 { font-size:17px; }
  .counters .n { font-size:14px; } .counters .c { padding:4px 9px; min-width:54px; }
  thead { display:table-header-group; }
  thead th { position:static; font-size:9px; color:#111; border-top:1.5px solid #111; padding:4px 5px; }
  table { font-size:11px; }
  tr { break-inside:avoid; page-break-inside:avoid; }
  tr.day { break-after:avoid; page-break-after:avoid; }
  td { padding:2.5px 5px; line-height:1.3; }
  tr.day td { padding:3px 5px; }
  tr.tot td { color:#111; font-weight:600; border-bottom:1.5px solid #111; }
  footer.doc { break-inside:avoid; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<div class="top" id="top">
  <header class="appbar">
    <div class="brand"><span class="mk">Rai · NY</span><span class="nm">RAI NYC Servizi</span><span class="pg">Collaudo</span></div>
    <nav class="hright" id="hright" aria-label="Pagine">
      <button type="button" class="icbtn" id="theme" aria-label="Cambia tema" title="Cambia tema">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
      </button>
      <a class="hlink go" href="." id="lnk-form">&larr; Nuova registrazione</a>
    </nav>
  </header>
  <form class="tools" id="tools" hidden>
    <div class="grp">
      <button type="button" class="btn sq" id="prev" title="Settimana precedente" aria-label="Settimana precedente"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <label class="wk">Settimana <input type="text" id="week" pattern="\d{4}-W\d{1,2}" placeholder="2026-W41"></label>
      <button type="button" class="btn sq" id="next" title="Settimana successiva" aria-label="Settimana successiva"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="submit" class="btn">Vai</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp">
      <button type="button" class="btn" id="fold" aria-controls="doc"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="fold-t">Comprimi tutto</span></button>
      <button type="button" class="btn" id="undo" disabled title="Ctrl+Z"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 4L2 7l3 3M2.5 7H10a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tx">Annulla ultima modifica</span></button>
    </div>
    <span class="msg" id="msg" role="status" aria-live="polite"></span>
    <button type="button" class="btn" id="email"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h12v8H2zM2.5 4.5L8 9l5.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="email-t">Invia per e-mail</span></button>
    <button type="button" class="btn pri" id="print"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 6V2h8v4M4 12H2.5V7h11v5H12M4.5 10h7v4h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Stampa</button>
  </form>
</div>
<div class="page">
  <form id="login" class="panel" hidden autocomplete="on">

<script>
// ---- pages/shared.js ----
// Shared browser code for form.html and collaudo.html. Inlined by scripts/build_pages.mjs.
// Session: Supabase Auth password grant, kept in localStorage, refreshed before it expires.
// All data goes through the function's /api routes with the bearer; auth goes to /auth/v1 on
// the same origin (locally the CLI gateway, in production <ref>.supabase.co).

var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5cnRoZndya2dkb2JsbHpzc2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjI2MDIsImV4cCI6MjEwNzU5ODYwMn0.UE8hAaDlRY5pgsMs8hUMKE5bIVF_Jc5eP1Z2e954Kd4";
// Served by the function itself: the placeholders are empty and everything is same-origin.
// Built as static pages (scripts/build_pages.mjs --static): absolute URLs are filled in at build time.
var APP_BASE = "https://wyrthfwrkgdobllzssdv.supabase.co/functions/v1/servizi" || (function () {
  var p = location.pathname.replace(/\/+$/, "");
  var i = p.indexOf("/servizi");
  return i >= 0 ? p.slice(0, i + "/servizi".length) : p;
})();
var AUTH_URL = ("https://wyrthfwrkgdobllzssdv.supabase.co" || location.origin) + "/auth/v1";
var PAGE_FORM = "./" || APP_BASE;
var PAGE_COLLAUDO = "./collaudo.html" || APP_BASE + "/collaudo";
var PAGE_GESTIONE = "./gestione.html" || APP_BASE + "/gestione";

function ApiError(kind, message) { this.kind = kind; this.message = message; }
ApiError.prototype = Object.create(Error.prototype);

var Session = {
  KEY: "rainyc.sessione",
  get: function () { try { return JSON.parse(localStorage.getItem(this.KEY) || "null"); } catch (e) { return null; } },
  set: function (s) { try { localStorage.setItem(this.KEY, JSON.stringify(s)); } catch (e) { /* storage blocked */ } },
  clear: function () { try { localStorage.removeItem(this.KEY); } catch (e) { /* ignore */ } }
};

function storeSession(data) {
  Session.set({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
    email: data.user && data.user.email
  });
}

var LOGIN_DOMAIN = "rainyc.nyc";
/** "De Marco" / "de marco" / "de.marco@rainyc.nyc" -> "de.marco@rainyc.nyc". Operators log in with their name. */
function loginEmail(name) {
  var s = (name || "").trim().toLowerCase();
  if (s.indexOf("@") >= 0) return s;
  return s.replace(/\s+/g, ".") + "@" + LOGIN_DOMAIN;
}
/** @returns {Promise<{ok:boolean, error?:string}>} */
function login(name, password) {
  var email = loginEmail(name);
  return fetch(AUTH_URL + "/token?grant_type=password", {
    method: "POST",
    headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (b) {
      if (r.ok && b.access_token) { storeSession(b); return { ok: true }; }
      if (r.status === 400 || r.status === 401) return { ok: false, error: "Nome o password non corretti." };
      return { ok: false, error: "Accesso non riuscito (" + r.status + "). Riprovare." };
    });
  }, function () { return { ok: false, error: "Rete non raggiungibile." }; });
}

var refreshing = null;
/** @returns {Promise<boolean>} */
function refreshSession() {
  if (refreshing) return refreshing;
  var s = Session.get();
  if (!s || !s.refresh_token) return Promise.resolve(false);
  refreshing = fetch(AUTH_URL + "/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: s.refresh_token })
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (b) {
      if (r.ok && b.access_token) { storeSession(b); return true; }
      if (r.status >= 400 && r.status < 500) Session.clear();
      return false;
    });
  }, function () { return false; }).then(function (ok) { refreshing = null; return ok; });
  return refreshing;
}

function logout() { Session.clear(); }

/**
 * Call the function API. Resolves {status, body}; rejects with ApiError kind
 * "auth" (log in again) or "network" (retry later). 4xx answers resolve normally.
 */
function api(path, init, retried) {
  var s = Session.get();
  if (!s) return Promise.reject(new ApiError("auth", "Accesso richiesto."));
  var soon = (s.expires_at || 0) * 1000 - Date.now() < 60000;
  var ready = soon ? refreshSession().then(function (ok) { if (!ok) throw new ApiError("auth", "Sessione scaduta: accedere di nuovo."); }) : Promise.resolve();
  return ready.then(function () {
    var cur = Session.get();
    if (!cur) throw new ApiError("auth", "Accesso richiesto.");
    var opts = Object.assign({}, init || {});
    opts.headers = Object.assign({ Authorization: "Bearer " + cur.access_token, "Content-Type": "application/json" }, (init && init.headers) || {});
    return fetch(APP_BASE + path, opts).then(null, function () { throw new ApiError("network", "Rete non raggiungibile."); });
  }).then(function (r) {
    if (r.status === 401 && !retried) {
      return refreshSession().then(function (ok) {
        if (ok) return api(path, init, true);
        throw new ApiError("auth", "Sessione scaduta: accedere di nuovo.");
      });
    }
    return r.text().then(function (t) {
      var body = null;
      try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
      if (r.status === 401) throw new ApiError("auth", "Sessione scaduta: accedere di nuovo.");
      if (r.status >= 500 || r.status === 429) throw new ApiError("network", (body && body.error) || "Servizio non disponibile.");
      return { status: r.status, body: body };
    });
  });
}

/** Wire a login panel: elements #login, #login-email, #login-password, #login-err. Calls onReady() when signed in. */
function requireLogin(onReady) {
  var panel = document.getElementById("login");
  var email = document.getElementById("login-email");
  var pass = document.getElementById("login-password");
  var err = document.getElementById("login-err");
  function show() {
    panel.hidden = false;
    try { email.value = localStorage.getItem("rainyc.email") || ""; } catch (e) { /* ignore */ }
    (email.value ? pass : email).focus();
  }
  function done() { panel.hidden = true; onReady(); }
  panel.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.textContent = "";
    var b = panel.querySelector("button");
    b.disabled = true;
    login(email.value.trim(), pass.value).then(function (res) {
      b.disabled = false;
      if (!res.ok) { err.textContent = res.error; pass.focus(); pass.select(); return; }
      try { localStorage.setItem("rainyc.email", email.value.trim()); } catch (e) { /* ignore */ }
      pass.value = "";
      done();
    });
  });
  if (Session.get()) done(); else show();
  // Any later auth failure brings the panel back.
  document.addEventListener("rainyc:auth-lost", function () { if (panel.hidden) show(); });
}

function authLost() { Session.clear(); document.dispatchEvent(new Event("rainyc:auth-lost")); }

/** "Esci" in the header `slot`: clears the session and shows the login again (the queue stays in this browser). */
function mountLogout(slot) {
  var old = document.getElementById("lnk-esci");
  if (old) old.parentNode.removeChild(old);
  if (!slot || !Session.get()) return;
  var a = document.createElement("a");
  a.href = "#"; a.id = "lnk-esci"; a.className = "hlink"; a.textContent = "Esci";
  var s = Session.get(); if (s && s.email) a.title = "Esci (" + String(s.email).split("@")[0] + ")";
  a.addEventListener("click", function (ev) { ev.preventDefault(); logout(); mountPassword(null); mountLogout(null); document.dispatchEvent(new Event("rainyc:auth-lost")); });
  slot.insertBefore(a, slot.firstChild);
}

/**
 * Change the signed-in user's password (Supabase Auth: PUT /auth/v1/user with the access token).
 * @returns {Promise<{ok:boolean, error?:string}>} error is Italian, ready to show.
 */
function changePassword(newPassword, retried) {
  var s = Session.get();
  if (!s) return Promise.resolve({ ok: false, error: "Sessione scaduta: accedere di nuovo." });
  var soon = (s.expires_at || 0) * 1000 - Date.now() < 60000;
  var ready = soon ? refreshSession() : Promise.resolve(true);
  return ready.then(function (ok) {
    var cur = Session.get();
    if (!ok || !cur) return { ok: false, error: "Sessione scaduta: accedere di nuovo." };
    return fetch(AUTH_URL + "/user", {
      method: "PUT",
      headers: { apikey: ANON_KEY, Authorization: "Bearer " + cur.access_token, "Content-Type": "application/json" },
      body: JSON.stringify({ password: newPassword })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return { ok: true };
        if (r.status === 401 && !retried) return refreshSession().then(function (ok2) { return ok2 ? changePassword(newPassword, true) : { ok: false, error: "Sessione scaduta: accedere di nuovo." }; });
        var code = b.error_code || b.code || "";
        if (code === "same_password") return { ok: false, error: "La nuova password deve essere diversa da quella attuale." };
        if (code === "weak_password") return { ok: false, error: "Password troppo debole: sceglierne una piu lunga o meno comune." };
        if (r.status === 401 || r.status === 403) return { ok: false, error: "Sessione scaduta: accedere di nuovo." };
        if (r.status === 429) return { ok: false, error: "Troppi tentativi. Riprovare tra qualche minuto." };
        return { ok: false, error: "Password non aggiornata (" + r.status + "). Riprovare." };
      });
    }, function () { return { ok: false, error: "Rete non raggiungibile." }; });
  });
}

// ---- theme (light / dark), shared by both pages ----
// The <head> of each page sets data-theme before first paint (same rule as themeNow below);
// this wires the header button. Saved choice in localStorage "rainyc.tema"; none saved = follow the OS.
var THEME_KEY = "rainyc.tema";
function themeSaved() { try { var t = localStorage.getItem(THEME_KEY); return t === "light" || t === "dark" ? t : null; } catch (e) { return null; } }
function themeOs() { try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; } }
function themeNow() { return themeSaved() || themeOs(); }
function applyTheme(t, btn) {
  document.documentElement.setAttribute("data-theme", t);
  if (btn) {
    var label = t === "dark" ? "Passa al tema chiaro" : "Passa al tema scuro";
    btn.setAttribute("aria-label", label); btn.title = label;
    btn.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
  }
}
/** Wire the theme toggle button (id). */
function initTheme(id) {
  var btn = document.getElementById(id);
  applyTheme(themeNow(), btn);
  if (btn) btn.addEventListener("click", function () {
    var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* storage blocked: this page only */ }
    applyTheme(t, btn);
  });
  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var follow = function () { if (!themeSaved()) applyTheme(themeOs(), btn); };
    if (mq.addEventListener) mq.addEventListener("change", follow); else if (mq.addListener) mq.addListener(follow);
  } catch (e) { /* old browser: no live follow */ }
}

// ---- change password: only the account that administers the system ----
var PASSWORD_ADMIN = "caruso@rainyc.nyc";
function canChangePassword() {
  var s = Session.get();
  return !!(s && s.email && String(s.email).toLowerCase() === PASSWORD_ADMIN);
}
/**
 * Mount "Cambia password" for the admin account only: the link goes into `slot` (an element in
 * the header), the panel drops below the header. For every other account nothing is created.
 * Call after login; safe to call again (it removes what it made when the account changes).
 */
function mountPassword(slot) {
  var old = document.getElementById("pwd-root");
  if (old) old.parentNode.removeChild(old);
  var oldLink = document.getElementById("lnk-pwd");
  if (oldLink) oldLink.parentNode.removeChild(oldLink);
  var oldG = document.getElementById("lnk-gestione");
  if (oldG) oldG.parentNode.removeChild(oldG);
  if (!slot || !canChangePassword()) return;
  if (!document.body.hasAttribute("data-gestione")) {
    var g = document.createElement("a");
    g.href = PAGE_GESTIONE; g.id = "lnk-gestione"; g.className = "hlink"; g.textContent = "Gestione";
    slot.insertBefore(g, slot.firstChild);
  }
  var a = document.createElement("a");
  a.href = "#"; a.id = "lnk-pwd"; a.className = "hlink"; a.textContent = "Cambia password";
  slot.insertBefore(a, slot.firstChild);
  var root = document.createElement("div");
  root.id = "pwd-root"; root.className = "pop-pwd"; root.hidden = true;
  root.innerHTML =
    '<form id="pwd" class="pwd" autocomplete="off" novalidate>' +
    '<h2 class="ph">Cambia password</h2>' +
    '<div class="fld"><label for="pwd-new">Nuova password <span class="hint">(almeno 5 caratteri)</span></label><input type="password" id="pwd-new" autocomplete="new-password"></div>' +
    '<div class="fld"><label for="pwd-conf">Conferma</label><input type="password" id="pwd-conf" autocomplete="new-password"></div>' +
    '<div class="row"><button type="submit" class="btn pri" id="pwd-save">Salva</button><button type="button" class="btn" id="pwd-close">Chiudi</button></div>' +
    '<div class="pwd-msg" id="pwd-msg" role="alert"></div></form>';
  document.body.appendChild(root);
  var $p = function (id) { return document.getElementById(id); };
  function close() { root.hidden = true; $p("pwd-new").value = ""; $p("pwd-conf").value = ""; $p("pwd-msg").textContent = ""; a.setAttribute("aria-expanded", "false"); }
  a.setAttribute("aria-expanded", "false");
  a.addEventListener("click", function (ev) {
    ev.preventDefault();
    if (root.hidden) { root.hidden = false; a.setAttribute("aria-expanded", "true"); $p("pwd-msg").textContent = ""; $p("pwd-new").focus(); } else close();
  });
  $p("pwd-close").addEventListener("click", close);
  root.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); close(); a.focus(); } });
  $p("pwd").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var msg = $p("pwd-msg"), pa = $p("pwd-new").value, pc = $p("pwd-conf").value;
    function say(ok, t) { msg.className = "pwd-msg " + (ok ? "ok" : "ko"); msg.textContent = t; }
    if (pa.length < 5) { say(false, "La password deve avere almeno 5 caratteri."); $p("pwd-new").focus(); return; }
    if (pa !== pc) { say(false, "Le due password non coincidono."); $p("pwd-conf").focus(); return; }
    var b = $p("pwd-save"); b.disabled = true; say(true, "Salvataggio…");
    changePassword(pa).then(function (res) {
      b.disabled = false;
      if (res.ok) { $p("pwd-new").value = ""; $p("pwd-conf").value = ""; say(true, "Password aggiornata."); } else say(false, res.error);
    });
  });
  document.addEventListener("rainyc:auth-lost", function () { mountPassword(null); });
}

// ---- lib/week.js ----
// ISO week helpers. Plain JS so the same file runs in Deno (server) and, inlined by
// scripts/build_pages.mjs, in the browser pages. Dates are "YYYY-MM-DD" strings; all
// arithmetic is in UTC so the machine's time zone never shifts a day.

const DAY = 86400000;

/** @param {string} s @returns {number} ms since epoch at 00:00 UTC */
function utcOf(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) throw new Error("data non valida: " + s);
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}

/** @param {number} ms @returns {string} */
function isoDate(ms) {
  return new Date(ms).toISOString().slice(0, 10);
}

/** Monday = 0 … Sunday = 6. @param {number} ms */
function dow(ms) {
  return (new Date(ms).getUTCDay() + 6) % 7;
}

/** Monday of ISO week 1 of `year`, ms UTC. Jan 4 is always in week 1. */
function week1Monday(year) {
  const jan4 = Date.UTC(year, 0, 4);
  return jan4 - dow(jan4) * DAY;
}

/**
 * ISO week of a date.
 * @param {string} date "YYYY-MM-DD"
 * @returns {{year:number, week:number}}
 */
function isoWeekOf(date) {
  const d = utcOf(date);
  const thursday = d + (3 - dow(d)) * DAY;
  const year = new Date(thursday).getUTCFullYear();
  const week = Math.floor((thursday - Date.UTC(year, 0, 1)) / DAY / 7) + 1;
  return { year, week };
}

/** 52 or 53. @param {number} year */
function weeksInYear(year) {
  return isoWeekOf(year + "-12-28").week;
}

/**
 * Parse "2026-W41" (also "2026-W5", "2026-w41").
 * @param {string} text
 * @returns {{year:number, week:number}|null} null when malformed or out of range
 */
function parseWeek(text) {
  const m = /^\s*(\d{4})-[Ww](\d{1,2})\s*$/.exec(text || "");
  if (!m) return null;
  const year = +m[1];
  const week = +m[2];
  if (year < 2020 || year > 2100) return null;
  if (week < 1 || week > weeksInYear(year)) return null;
  return { year, week };
}

/** @param {{year:number, week:number}} w @returns {string} "2026-W41" */
function formatWeek(w) {
  return w.year + "-W" + String(w.week).padStart(2, "0");
}

/** The seven dates of an ISO week, Monday first. @param {{year:number, week:number}} w */
function weekDays(w) {
  const monday = week1Monday(w.year) + (w.week - 1) * 7 * DAY;
  const out = [];
  for (let i = 0; i < 7; i++) out.push(isoDate(monday + i * DAY));
  return out;
}

/** @param {{year:number, week:number}} w @param {number} delta @returns {{year:number, week:number}} */
function shiftWeek(w, delta) {
  const monday = week1Monday(w.year) + (w.week - 1) * 7 * DAY;
  return isoWeekOf(isoDate(monday + delta * 7 * DAY));
}

/** Today's date in New York as "YYYY-MM-DD". */
function todayNewYork(now) {
  const d = now || new Date();
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(d);
  const get = (t) => parts.find((p) => p.type === t).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}

const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
  "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const GIORNI = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];

/** "Lunedì 5 ottobre 2026" @param {string} date */
function fmtDay(date) {
  const ms = utcOf(date);
  const d = new Date(ms);
  return GIORNI[dow(ms)] + " " + d.getUTCDate() + " " + MESI[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

/** "5–11 ottobre 2026" / "28 settembre – 4 ottobre 2026" / across years. */
function fmtRange(a, b) {
  const da = new Date(utcOf(a)), db = new Date(utcOf(b));
  const ya = da.getUTCFullYear(), yb = db.getUTCFullYear();
  const ma = da.getUTCMonth(), mb = db.getUTCMonth();
  if (ya !== yb) return da.getUTCDate() + " " + MESI[ma] + " " + ya + " – " + db.getUTCDate() + " " + MESI[mb] + " " + yb;
  if (ma !== mb) return da.getUTCDate() + " " + MESI[ma] + " – " + db.getUTCDate() + " " + MESI[mb] + " " + yb;
  return da.getUTCDate() + "–" + db.getUTCDate() + " " + MESI[ma] + " " + ya;
}

// ---- lib/collaudo.js ----
// Weekly collaudo: rows of public.v_weekly_collaudo -> HTML fragment.
// Plain JS, shared by Deno tests and (inlined) the browser page. Layout follows the sheet
// Marco sends to Rome ("2026 Rai Erika", one tab per week): network totals on top, one block
// per day whose header names who is in trasferta and where, rows in the sheet's column order,
// a totals row per day. scripts/render_collaudo.py stays the offline CSV tool.


const CATEGORIE = ["pezzo", "radio", "live", "tappeto"];
const CAT_LABEL = { pezzo: "Pezzi", radio: "Radio", live: "Live", tappeto: "Tappeti" };
// Per-rete counters in the sheet's order. Tappeto rows count only under Tappeti.
const RETI = ["Rainews.it", "Tg1", "Tg2", "Tg3", "RAN", "Rai Sport", "GR", "Altre"];
// Screen columns. The last four (assistenza, operatore, data, azioni) never print: the printed
// sheet has exactly Rome's columns (PRINT_COLS), in this order.
const COLS = ["Titolo", "Giornalista", "Richiedente", "Rete", "Durata",
  "Pezzi", "Radio", "Live", "Trasferta", "Mezzo", "Tappeti", "Ass. tecnica", "Operatore", "Data", ""];
const CHECK_COLS = ["Pezzi", "Radio", "Live", "Tappeti", "Ass. tecnica"];
const SCREEN_ONLY = ["Ass. tecnica", "Operatore", "Data", ""];
const ROME_LABEL = { Titolo: "Titolo del servizio", Mezzo: "Mezzo di trasmissione" };
/** Column headings as printed, in Rome's order. */
const PRINT_COLS = COLS.filter((c) => !SCREEN_ONLY.includes(c)).map((c) => ROME_LABEL[c] || c);

// Collaudo column -> field name of POST /api/update (patch key) and the editor to use.
const EDIT_FIELDS = {
  titolo: { api: "subject", kind: "text" },
  giornalista: { api: "journalist", kind: "select" },
  richiedente: { api: "richiedente", kind: "datalist" },
  rete: { api: "rete", kind: "select" },
  durata: { api: "duration_text", kind: "text" },
  trasferta: { api: "trasferta", kind: "bool" },
  mezzo: { api: "mezzo", kind: "select" },
  operatore: { api: "operator", kind: "select" },
  data: { api: "delivery_date", kind: "date" },
};
const API_KIND = Object.fromEntries(Object.values(EDIT_FIELDS).map((f) => [f.api, f.kind]));

/** Editor kind for an API field name: text | select | datalist | bool | date. */
function editorKind(apiField) {
  return API_KIND[apiField] || "text";
}

/** Cell text (data-v) -> value for the update patch: "true"/"false" become booleans, text is trimmed. */
function toPatchValue(apiField, raw) {
  if (editorKind(apiField) === "bool") return String(raw) === "true";
  return String(raw == null ? "" : raw).trim();
}

/** Names from /api/lists entries that are either strings or {display_name}. */
function listNames(items) {
  return (Array.isArray(items) ? items : [])
    .map((x) => (typeof x === "string" ? x : x && (x.display_name || x.value)) || "")
    .filter((x) => x !== "");
}

/** Options for a <select>: the list, plus the current value if the list lacks it, plus a blank when empty. */
function selectOptions(names, current) {
  const out = names.slice();
  const cur = String(current == null ? "" : current);
  if (cur !== "" && !out.includes(cur)) out.unshift(cur);
  if (cur === "") out.unshift("");
  return out;
}

// Trailing cell of day/total rows: spans the screen-only columns (hidden in print).
const NP_TAIL = `<td class="np" colspan="${COLS.length - PRINT_COLS.length}"></td>`;

/** @param {string} rete @returns {string|null} */
function reteBucket(rete) {
  const r = (rete || "").trim();
  if (r === "Tappeto") return null;
  if (r.toUpperCase().startsWith("GR")) return "GR";
  if (RETI.includes(r)) return r;
  return "Altre";
}

/** @param {unknown} s */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/**
 * Totals for a set of rows (one ISO week).
 * @param {Array<{categoria:string, rete:string, trasferta:boolean}>} rows
 */
function totals(rows) {
  const cat = Object.fromEntries(CATEGORIE.map((c) => [c, 0]));
  const rete = Object.fromEntries(RETI.map((r) => [r, 0]));
  let trasferte = 0;
  for (const r of rows) {
    if (r.categoria in cat) cat[r.categoria] += 1;
    const b = reteBucket(r.rete);
    if (b) rete[b] += 1;
    if (r.trasferta === true) trasferte += 1;
  }
  return { cat, rete, trasferte, righe: rows.length };
}

/** "5 ott" @param {string} date */
function shortDate(date) {
  const d = new Date(date + "T00:00:00Z");
  return d.getUTCDate() + " " + MESI[d.getUTCMonth()].slice(0, 3);
}

/**
 * Who is in trasferta on `day`, from the week's rows: "Lo Prete, Washington D.C. (24–26 ago)".
 * Legacy rows (trasferta true, no details) give "sì (dettagli non registrati)".
 * @param {string} day @param {Array<Record<string, unknown>>} rows
 */
function trasferteOn(day, rows) {
  const seen = new Set();
  const out = [];
  let legacy = false;
  for (const r of rows) {
    if (r.trasferta !== true) continue;
    if (!r.trasferta_dal || !r.trasferta_al) {
      if (r.data === day) legacy = true;
      continue;
    }
    if (day < String(r.trasferta_dal) || day > String(r.trasferta_al)) continue;
    const key = [r.trasferta_giornalista, r.trasferta_luogo, r.trasferta_dal, r.trasferta_al].join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    const range = r.trasferta_dal === r.trasferta_al
      ? shortDate(String(r.trasferta_dal))
      : shortDate(String(r.trasferta_dal)) + "–" + shortDate(String(r.trasferta_al));
    out.push(`${r.trasferta_giornalista || "?"}, ${r.trasferta_luogo || "?"} (${range})`);
  }
  if (legacy) out.push("sì (dettagli non registrati)");
  return out;
}

/** "15/10" from "2026-10-15". */
function dm(date) {
  const d = new Date(date + "T00:00:00Z");
  return d.getUTCDate() + "/" + (d.getUTCMonth() + 1);
}

/**
 * Short trasferta note for the cell (screen only): "Washington D.C. 15–16/10", "Roma 30/9–2/10",
 * "Boston 15/10". Empty when the row has no trip details (legacy rows).
 * @param {Record<string, unknown>} r
 */
function tripNote(r) {
  if (r.trasferta !== true || !r.trasferta_dal || !r.trasferta_al) return "";
  const dal = String(r.trasferta_dal), al = String(r.trasferta_al);
  let range;
  if (dal === al) range = dm(dal);
  else if (dal.slice(0, 7) === al.slice(0, 7)) range = Number(dal.slice(8, 10)) + "–" + dm(al);
  else range = dm(dal) + "–" + dm(al);
  return [r.trasferta_luogo ? String(r.trasferta_luogo) : "", range].filter(Boolean).join(" ");
}

// Day header chevron (screen only; aria-hidden, no text so the header text stays the day name).
const CHEVRON = '<svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
  '<path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/**
 * Render the collaudo body (header, counters, table, footer) for one week.
 * @param {{year:number, week:number}} w
 * @param {Array<Record<string, unknown>>} rows  v_weekly_collaudo rows, already in order
 * @param {string} generated  "YYYY-MM-DD"
 * @returns {string} HTML
 */
function renderCollaudo(w, rows, generated) {
  const days = weekDays(w);
  const byDay = Object.fromEntries(days.map((d) => [d, []]));
  for (const r of rows) if (r.data in byDay) byDay[r.data].push(r);

  const t = totals(rows);
  const groups = [];
  for (const d of days) {
    const body = [];
    const dayRows = byDay[d];
    const trips = trasferteOn(d, rows);
    const tripHead = trips.length ? ` <span class="trip">Trasferta: ${esc(trips.join(" · "))}</span>` : "";
    // One <tbody> per day: the page collapses a day by its data-day; the header button toggles it.
    const count = dayRows.length ? `<span class="dn scr">${dayRows.length}</span>` : "";
    body.push(`<tr class="day"><td colspan="${PRINT_COLS.length}"><button type="button" class="dt" data-day="${d}" aria-expanded="true">` +
      `${CHEVRON}<span class="dl">${esc(fmtDay(d))}</span>${count}</button>${tripHead}</td>${NP_TAIL}</tr>`);
    if (!dayRows.length) {
      body.push(`<tr class="empty"><td colspan="${PRINT_COLS.length}">Nessuna registrazione</td>${NP_TAIL}</tr>`);
      groups.push(`<tbody class="dg vuoto" data-day="${d}">\n${body.join("\n")}\n</tbody>`);
      continue;
    }
    const dayTot = Object.fromEntries(CATEGORIE.map((c) => [c, 0]));
    for (const r of dayRows) {
      const cat = String(r.categoria || "").toLowerCase();
      if (cat in dayTot) dayTot[cat] += 1;
      const si = r.trasferta === true;
      const k = (c) => `<td class="k">${cat === c ? "✓" : ""}</td>`;
      const ed = (col, cls, shown, value, extra) =>
        `<td class="ed${cls ? " " + cls : ""}" data-f="${EDIT_FIELDS[col].api}" data-v="${esc(value)}"${extra || ""}>${shown}</td>`;
      const note = tripNote(r);
      // The trasferta editor (a popover on the page) starts from these.
      const tripData = si ? ` data-tj="${esc(r.trasferta_giornalista)}" data-tl="${esc(r.trasferta_luogo)}"` +
        ` data-td="${esc(r.trasferta_dal)}" data-ta="${esc(r.trasferta_al)}"` : "";
      body.push(`<tr class="r" data-id="${esc(r.record_id)}">` +
        ed("titolo", "", esc(r.titolo), r.titolo) +
        ed("giornalista", "nowrap", esc(r.giornalista), r.giornalista) +
        ed("richiedente", "", esc(r.richiedente), r.richiedente) +
        ed("rete", "nowrap", esc(r.rete), r.rete) +
        ed("durata", "nowrap", esc(r.durata), r.durata) +
        k("pezzo") + k("radio") + k("live") +
        ed("trasferta", "k tcell", si ? '<span class="si"><span class="scr">✓</span><span class="prn">SI</span></span>' + (note ? `<span class="tn scr">${esc(note)}</span>` : "") : "",
          si ? "true" : "false", tripData) +
        ed("mezzo", "nowrap", esc(r.mezzo), r.mezzo) +
        k("tappeto") +
        `<td class="k np">X</td>` +
        ed("operatore", "nowrap np", esc(r.operatore), r.operatore) +
        ed("data", "nowrap np", esc(shortDate(String(r.data))), r.data) +
        '<td class="np act"><button type="button" class="ic" data-act="edit" title="Modifica" aria-label="Modifica">✎</button>' +
        '<button type="button" class="ic" data-act="void" title="Annulla registrazione" aria-label="Annulla registrazione">✕</button>' +
        '<span class="rowerr" role="alert"></span></td>' +
        "</tr>");
    }
    const dd = new Date(d + "T00:00:00Z");
    body.push(`<tr class="tot"><td colspan="5">Totale ${esc(GIORNI[(dd.getUTCDay() + 6) % 7].toLowerCase())} ${dd.getUTCDate()} ` +
      `(${dayRows.length} registrazioni)</td>` +
      `<td class="k">${dayTot.pezzo}</td><td class="k">${dayTot.radio}</td><td class="k">${dayTot.live}</td>` +
      `<td></td><td></td><td class="k">${dayTot.tappeto}</td>${NP_TAIL}</tr>`);
    groups.push(`<tbody class="dg" data-day="${d}">\n${body.join("\n")}\n</tbody>`);
  }

  const counter = (n, label, cls) =>
    `<div class="${cls || "c"}"><span class="n">${n}</span><span class="l">${esc(label)}</span></div>`;
  const tot = CATEGORIE.map((c) => counter(t.cat[c], CAT_LABEL[c], "c tot")).join("");
  const reti = RETI.map((k) => counter(t.rete[k], k === "GR" ? "GR 1,2,3" : k)).join("");
  const extra = counter(t.trasferte, "Trasferte");
  const head = COLS.map((c) => {
    const cls = [CHECK_COLS.includes(c) || c === "Trasferta" ? "k" : "", SCREEN_ONLY.includes(c) ? "np" : ""].filter(Boolean).join(" ");
    const label = ROME_LABEL[c] ? `<span class="scr">${c}</span><span class="prn">${ROME_LABEL[c]}</span>` : c;
    return `<th${cls ? ` class="${cls}"` : ""}>${label}</th>`;
  }).join("");
  const titleWeek = `Settimana ${w.week} (${fmtRange(days[0], days[6])})`;
  const g = new Date(generated + "T00:00:00Z");
  const gen = `${g.getUTCDate()} ${MESI[g.getUTCMonth()]} ${g.getUTCFullYear()}`;

  return `<header class="doc">
  <div class="ente">RAI – Sede di corrispondenza di New York</div>
  <h1>Collaudo settimanale</h1>
  <div class="sett">${esc(titleWeek)}</div>
</header>
<section class="counters" aria-label="Riepilogo">
  <div class="grp">${tot}</div>
  <div class="grp">${reti}</div>
  <div class="grp">${extra}</div>
</section>
<div class="table-wrap">
<table>
<thead><tr>${head}</tr></thead>
${groups.join("\n")}
</table>
</div>
<footer class="doc">
  <div class="gen">Generato il ${gen} dal sistema RAI NYC Servizi · fonte: database · ${rows.length} registrazioni · ${esc(formatWeek(w))}</div>
  <div class="firma">Firma del responsabile ______________________________</div>
</footer>`;
}

// ---- end lib/collaudo.js ----
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var current = null;
  var loadedOnce = false;
  $("lnk-form").href = PAGE_FORM;
  initTheme("theme");

  function setMsg(text, isErr) { var m = $("msg"); m.textContent = text; m.className = isErr ? "err" : "msg"; }
  // The sticky table header sits right under the sticky header + tools block.
  function syncTop() { document.documentElement.style.setProperty("--toph", $("top").offsetHeight + "px"); }
  window.addEventListener("resize", syncTop);

  function load(w, note) {
    current = w;
    closeTrip();
    $("week").value = formatWeek(w);
    try { history.replaceState(null, "", location.pathname + "?week=" + formatWeek(w)); } catch (e) { /* ignore */ }
    setMsg("Caricamento…");
    document.title = "Collaudo " + formatWeek(w) + " · RAI NYC Servizi";
    if (!loadedOnce) $("doc").innerHTML = '<div class="state">Caricamento della settimana ' + esc(formatWeek(w)) + "…</div>";
    else $("doc").classList.add("busy");
    return api("/api/collaudo?week=" + formatWeek(w)).then(function (r) {
      $("doc").classList.remove("busy");
      if (r.status !== 200) { failState((r.body && r.body.error) || "Errore."); return; }
      $("doc").innerHTML = renderCollaudo(w, r.body.rows, todayNewYork());
      loadedOnce = true;
      applyFold();
      setMsg(note || (r.body.rows.length + " registrazioni"));
    }, function (e) {
      $("doc").classList.remove("busy");
      if (e.kind === "auth") { authLost(); return; }
      failState(e.message);
    });
  }
  // Error in place: on the first load the sheet says so (with a retry); later the last sheet stays.
  function failState(text) {
    setMsg(text, true);
    if (loadedOnce) return;
    $("doc").innerHTML = '<div class="state ko">Collaudo non disponibile: ' + esc(text) +
      '<br><button type="button" class="btn" id="retry">Riprova</button></div>';
  }

  // ---- collapse days (per week, this browser tab) ----
  function foldKey() { return "rainyc.collaudo.chiusi." + (current ? formatWeek(current) : ""); }
  function foldGet() { try { return JSON.parse(sessionStorage.getItem(foldKey()) || "[]"); } catch (e) { return []; } }
  function foldSet(days) { try { sessionStorage.setItem(foldKey(), JSON.stringify(days)); } catch (e) { /* storage blocked: this view only */ } }
  function groups() { return Array.prototype.slice.call($("doc").querySelectorAll("tbody.dg")); }
  function applyFold() {
    var closed = foldGet();
    groups().forEach(function (g) {
      var shut = closed.indexOf(g.getAttribute("data-day")) >= 0;
      g.classList.toggle("chiuso", shut);
      var b = g.querySelector("button.dt"); if (b) b.setAttribute("aria-expanded", shut ? "false" : "true");
    });
    syncFoldBtn();
  }
  function syncFoldBtn() {
    var gs = groups(), allShut = gs.length > 0 && gs.every(function (g) { return g.classList.contains("chiuso"); });
    $("fold-t").textContent = allShut ? "Espandi tutto" : "Comprimi tutto";
    $("fold").setAttribute("aria-expanded", allShut ? "false" : "true");
    $("fold").disabled = !gs.length;
  }
  function saveFold() {
    foldSet(groups().filter(function (g) { return g.classList.contains("chiuso"); }).map(function (g) { return g.getAttribute("data-day"); }));
  }
  function toggleDay(btn) {
    var g = btn.closest("tbody.dg"); if (!g) return;
    var shut = !g.classList.contains("chiuso");
    g.classList.toggle("chiuso", shut);
    btn.setAttribute("aria-expanded", shut ? "false" : "true");
    saveFold(); syncFoldBtn();
  }
  $("fold").addEventListener("click", function () {
    var gs = groups(), shut = !gs.every(function (g) { return g.classList.contains("chiuso"); });
    gs.forEach(function (g) {
      g.classList.toggle("chiuso", shut);
      var b = g.querySelector("button.dt"); if (b) b.setAttribute("aria-expanded", shut ? "false" : "true");
    });
    saveFold(); syncFoldBtn();
  });

  // ---- editing, void and undo ----
  var undoStack = [];   // last 20 actions: {kind:"edit", id, field, old} | {kind:"patch", id, patch} | {kind:"void", id}
  var busy = false;
  var lists = null;

  function pushUndo(a) { undoStack.push(a); if (undoStack.length > 20) undoStack.shift(); syncUndo(); }
  function syncUndo() { $("undo").disabled = busy || !undoStack.length; }
  function setBusy(b) { busy = b; syncUndo(); }

  function post(path, body) {
    return api(path, { method: "POST", body: JSON.stringify(body) }).then(null, function (e) {
      if (e.kind === "auth") { authLost(); return null; }
      return { status: 0, body: { error: e.message } };
    });
  }
  function rowOf(id) {
    var rows = $("doc").querySelectorAll("tr.r");
    for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-id") === id) return rows[i];
    return null;
  }
  function rowError(id, text) {
    var tr = rowOf(id), span = tr && tr.querySelector(".rowerr");
    if (span) span.textContent = text; else setMsg(text, true);
  }
  function errText(r) { return (r.body && r.body.error) || "Operazione non riuscita (" + r.status + ")."; }

  function ensureLists() {
    if (lists) return Promise.resolve(lists);
    return api("/api/lists").then(function (r) {
      if (r.status !== 200 || !r.body) return null;
      lists = r.body;
      var dl = document.createElement("datalist");
      dl.id = "dl-richiedenti";
      (lists.richiedenti || []).forEach(function (x) {
        var o = document.createElement("option"); o.value = typeof x === "string" ? x : x.value; dl.appendChild(o);
      });
      document.body.appendChild(dl);
      return lists;
    }, function () { return null; });
  }
  var LIST_OF = { journalist: "giornalisti", operator: "operatori", rete: "reti", mezzo: "mezzi" };

  function makeEditor(field, old, l) {
    var kind = editorKind(field), el;
    if (kind === "bool") {
      el = document.createElement("select");
      [["false", "No"], ["true", "Sì"]].forEach(function (p) {
        var o = document.createElement("option"); o.value = p[0]; o.textContent = p[1]; el.appendChild(o);
      });
      el.value = old;
    } else if (kind === "select" && l) {
      el = document.createElement("select");
      selectOptions(listNames(l[LIST_OF[field]]), old).forEach(function (n) {
        var o = document.createElement("option"); o.value = n; o.textContent = n; el.appendChild(o);
      });
      el.value = old;
    } else {
      el = document.createElement("input");
      el.type = kind === "date" ? "date" : "text";
      el.value = old;
      if (kind === "datalist" && l) el.setAttribute("list", "dl-richiedenti");
    }
    el.className = "edin";
    return el;
  }

  function startEdit(td) {
    if (busy || td.getAttribute("data-editing")) return;
    if (td.getAttribute("data-f") === "trasferta") { openTrip(td); return; }
    td.setAttribute("data-editing", "1");
    var field = td.getAttribute("data-f"), old = td.getAttribute("data-v") || "";
    var id = td.parentNode.getAttribute("data-id"), html = td.innerHTML, done = false;
    ensureLists().then(function (l) {
      var el = makeEditor(field, old, l);
      td.textContent = "";
      td.appendChild(el);
      el.focus();
      function finish(save) {
        if (done) return; done = true;
        var raw = el.value;
        td.innerHTML = html;
        td.removeAttribute("data-editing");
        if (save && raw.trim() !== old) saveEdit(td, id, field, old, raw);
      }
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
      });
      el.addEventListener("blur", function () { finish(true); });
      if (el.tagName === "SELECT") el.addEventListener("change", function () { finish(true); });
    });
  }

  function saveEdit(td, id, field, old, raw) {
    var patch = {}; patch[field] = toPatchValue(field, raw);
    td.classList.add("saving");
    setBusy(true);
    post("/api/update", { id: id, patch: patch }).then(function (r) {
      setBusy(false);
      td.classList.remove("saving");
      if (!r) return;
      if (r.status !== 200) { rowError(id, errText(r)); return; }
      pushUndo({ kind: "edit", id: id, field: field, old: toPatchValue(field, old) });
      load(current, "Modifica salvata.");
    });
  }

  // ---- trasferta: one popover, one POST /api/update with every trasferta field ----
  var trip = null; // {td, id, old:{on,tj,tl,td,ta}}
  function cellVal(tr, f) { var c = tr.querySelector('td[data-f="' + f + '"]'); return c ? c.getAttribute("data-v") || "" : ""; }
  function tripOn() { return $("tp-si").checked; }
  function syncTripDet() {
    var on = tripOn();
    $("tp-det").hidden = !on;
    if (on && trip) {
      var tr = trip.td.parentNode;
      if (!$("tp-g").value) $("tp-g").value = cellVal(tr, "journalist");
      if (!$("tp-d").value) $("tp-d").value = cellVal(tr, "delivery_date");
      if (!$("tp-a").value) $("tp-a").value = $("tp-d").value;
    }
  }
  function placePop(pop, anchor) {
    var r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.max(12, Math.min(r.left, document.documentElement.clientWidth - w - 12));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8 && r.top - h - 6 > $("top").offsetHeight) top = r.top - h - 6;
    pop.style.left = left + "px";
    pop.style.top = Math.max(8, top) + "px";
  }
  function openTrip(td) {
    if (busy) return;
    if (trip && trip.td === td) return; // already open on this cell
    var tr = td.parentNode;
    var old = { on: td.getAttribute("data-v") === "true", tj: td.getAttribute("data-tj") || "", tl: td.getAttribute("data-tl") || "",
      td: td.getAttribute("data-td") || "", ta: td.getAttribute("data-ta") || "" };
    ensureLists().then(function (l) {
      trip = { td: td, id: tr.getAttribute("data-id"), old: old };
      var sel = $("tp-g"); sel.textContent = "";
      selectOptions(listNames(l && l.giornalisti), old.tj).forEach(function (n) {
        var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o);
      });
      sel.value = old.tj;
      $("tp-l").value = old.tl; $("tp-d").value = old.td; $("tp-a").value = old.ta;
      $("tp-si").checked = old.on; $("tp-no").checked = !old.on;
      $("tpop-err").textContent = "";
      $("tp-save").disabled = false;
      $("tpop").hidden = false;
      syncTripDet();
      placePop($("tpop"), td);
      (old.on ? $("tp-si") : $("tp-no")).focus();
    });
  }
  function closeTrip(refocus) {
    if (!trip) return;
    var td = trip.td; trip = null;
    $("tpop").hidden = true;
    if (refocus && td && document.contains(td)) { var b = td.parentNode.querySelector('button[data-act="edit"]'); if (b) b.focus(); }
  }
  $("tp-si").addEventListener("change", syncTripDet);
  $("tp-no").addEventListener("change", syncTripDet);
  $("tp-cancel").addEventListener("click", function () { closeTrip(true); });
  $("tpop").addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { ev.preventDefault(); closeTrip(true); }
    else if (ev.key === "Enter" && ev.target.tagName !== "BUTTON") { ev.preventDefault(); $("tpop-f").requestSubmit(); }
  });
  document.addEventListener("mousedown", function (ev) {
    if (trip && !$("tpop").contains(ev.target) && !trip.td.contains(ev.target)) closeTrip(false);
  });
  $("tpop-f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!trip || busy) return;
    var t = trip, o = t.old, patch;
    if (tripOn()) patch = { trasferta: true, trasferta_journalist: $("tp-g").value, trasferta_luogo: $("tp-l").value.trim(), trasferta_dal: $("tp-d").value, trasferta_al: $("tp-a").value };
    else patch = { trasferta: false };
    var same = tripOn() ? (o.on && patch.trasferta_journalist === o.tj && patch.trasferta_luogo === o.tl && patch.trasferta_dal === o.td && patch.trasferta_al === o.ta) : !o.on;
    if (same) { closeTrip(true); return; }
    // Undo puts back exactly what was there. A legacy "Sì" without details cannot be rebuilt
    // (the server requires the details): its undo sends {trasferta:true} and shows the server's answer.
    var back = o.on ? (o.tj && o.td && o.ta ? { trasferta: true, trasferta_journalist: o.tj, trasferta_luogo: o.tl, trasferta_dal: o.td, trasferta_al: o.ta } : { trasferta: true }) : { trasferta: false };
    $("tpop-err").textContent = ""; $("tp-save").disabled = true;
    t.td.classList.add("saving");
    setBusy(true);
    post("/api/update", { id: t.id, patch: patch }).then(function (r) {
      setBusy(false);
      $("tp-save").disabled = false;
      t.td.classList.remove("saving");
      if (!r) { closeTrip(false); return; }
      if (r.status !== 200) { $("tpop-err").textContent = errText(r); return; }
      pushUndo({ kind: "patch", id: t.id, patch: back });
      closeTrip(false);
      load(current, "Trasferta salvata.");
    });
  });

  function voidRow(tr) {
    if (busy || !window.confirm("Annullare questa registrazione?")) return;
    var id = tr.getAttribute("data-id");
    setBusy(true);
    post("/api/void", { id: id, reason: "annullata dal collaudo" }).then(function (r) {
      setBusy(false);
      if (!r) return;
      if (r.status !== 200) { rowError(id, errText(r)); return; }
      pushUndo({ kind: "void", id: id });
      load(current, "Registrazione annullata.");
    });
  }

  function undo() {
    if (busy || !undoStack.length) return;
    var a = undoStack[undoStack.length - 1], req;
    if (a.kind === "void") req = post("/api/unvoid", { id: a.id });
    else if (a.kind === "patch") req = post("/api/update", { id: a.id, patch: a.patch });
    else { var patch = {}; patch[a.field] = a.old; req = post("/api/update", { id: a.id, patch: patch }); }
    setBusy(true);
    req.then(function (r) {
      setBusy(false);
      if (!r) return;
      if (r.status !== 200) { setMsg(errText(r), true); return; }
      undoStack.pop(); syncUndo();
      load(current, a.kind === "void" ? "Registrazione ripristinata." : "Modifica annullata.");
    });
  }

  // One click edits a cell (a double-click did not open the trasferta on Windows/Chrome); the ✎ pencil opens the trasferta editor.
  $("doc").addEventListener("click", function (ev) {
    if (!ev.target.closest) return;
    var dt = ev.target.closest("button.dt");
    if (dt) { toggleDay(dt); return; }
    if (ev.target.closest("#retry")) { if (current) load(current); return; }
    var b = ev.target.closest("button[data-act]");
    if (b) {
      var tr = b.closest("tr.r");
      if (b.getAttribute("data-act") === "void") voidRow(tr);
      else openTrip(tr.querySelector('td[data-f="trasferta"]'));
      return;
    }
    var td = ev.target.closest("td.ed");
    if (td && !ev.target.closest(".edin")) startEdit(td);
  });
  $("undo").addEventListener("click", undo);
  document.addEventListener("keydown", function (ev) {
    if (!(ev.ctrlKey || ev.metaKey) || ev.shiftKey || ev.key.toLowerCase() !== "z") return;
    var t = ev.target && ev.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
    ev.preventDefault();
    undo();
  });

  $("tools").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var w = parseWeek($("week").value);
    if (!w) { setMsg("Settimana non valida: usare la forma 2026-W41.", true); return; }
    load(w);
  });
  $("prev").addEventListener("click", function () { if (current) load(shiftWeek(current, -1)); });
  $("next").addEventListener("click", function () { if (current) load(shiftWeek(current, 1)); });
  $("print").addEventListener("click", function () { closeTrip(false); window.print(); });
  // E-mail the week (POST /api/email-collaudo {week, to}). Only the accounts the server allows see the button
  // (GET /api/email-recipients: {allowed, suggested}); the dialog ticks the suggested addresses and takes new ones.
  var RKEY = "rainyc.collaudo.destinatari"; // addresses added by hand in this browser
  var mail = { suggested: [], extra: [] };
  function extraLoad() { try { return JSON.parse(localStorage.getItem(RKEY) || "[]").filter(isEmail); } catch (e) { return []; } }
  function extraSave() { try { localStorage.setItem(RKEY, JSON.stringify(mail.extra)); } catch (e) { /* this view only */ } }
  function isEmail(x) { return typeof x === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x); }
  function renderRcp(ticked) {
    var ul = $("rcp"); ul.textContent = "";
    var all = mail.suggested.map(function (a) { return { a: a, own: false }; }).concat(mail.extra.map(function (a) { return { a: a, own: true }; }));
    all.forEach(function (x, k) {
      var li = document.createElement("li"), l = document.createElement("label"), c = document.createElement("input");
      c.type = "checkbox"; c.value = x.a; c.checked = ticked ? ticked.indexOf(x.a) >= 0 : !x.own; c.id = "rcp" + k;
      l.appendChild(c); l.appendChild(document.createTextNode(x.a)); li.appendChild(l);
      if (x.own) { var rm = document.createElement("button"); rm.type = "button"; rm.className = "rm"; rm.title = "Togli dall'elenco"; rm.setAttribute("aria-label", "Togli " + x.a); rm.textContent = "✕"; rm.setAttribute("data-rm", x.a); li.appendChild(rm); }
      ul.appendChild(li);
    });
    if (!all.length) { var li0 = document.createElement("li"); li0.textContent = "Nessun destinatario: aggiungerne uno qui sotto."; li0.style.color = "var(--dim)"; ul.appendChild(li0); }
    syncSend();
  }
  function rcpChosen() { return Array.prototype.map.call($("rcp").querySelectorAll("input:checked"), function (c) { return c.value; }); }
  function syncSend() { var n = rcpChosen().length; $("mp-send").textContent = n ? "Invia a " + n : "Invia"; $("mp-send").disabled = !n; }
  function addRcp() {
    var v = $("rcp-new").value.trim().toLowerCase();
    if (!isEmail(v)) { $("mpop-err").textContent = "Indirizzo e-mail non valido."; $("rcp-new").focus(); return; }
    $("mpop-err").textContent = "";
    var ticked = rcpChosen(); ticked.push(v);
    if (mail.suggested.indexOf(v) < 0 && mail.extra.indexOf(v) < 0) { mail.extra.push(v); extraSave(); }
    $("rcp-new").value = ""; renderRcp(ticked); $("rcp-new").focus();
  }
  function openMail() {
    if (!current) return;
    var wk = formatWeek(current);
    $("mpop-h").textContent = "Invia per e-mail · " + wk;
    $("mpop-lead").textContent = "Il collaudo della settimana " + wk + " (colonne di Roma, senza operatori) parte dalla casella della redazione. Scegliere i destinatari.";
    $("mpop-err").textContent = ""; $("mpop-msg").textContent = ""; $("rcp-new").value = "";
    mail.extra = extraLoad();
    renderRcp(null);
    $("mpop").hidden = false;
    var first = $("rcp").querySelector("input"); (first || $("rcp-new")).focus();
  }
  function closeMail() { $("mpop").hidden = true; $("email").focus(); }
  $("email").addEventListener("click", openMail);
  $("mp-cancel").addEventListener("click", closeMail);
  $("rcp-add").addEventListener("click", addRcp);
  $("rcp-new").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); addRcp(); } });
  $("rcp").addEventListener("change", syncSend);
  $("rcp").addEventListener("click", function (ev) {
    var rm = ev.target.closest && ev.target.closest("button[data-rm]"); if (!rm) return;
    var a = rm.getAttribute("data-rm"); mail.extra = mail.extra.filter(function (x) { return x !== a; }); extraSave();
    renderRcp(rcpChosen().filter(function (x) { return x !== a; }));
  });
  $("mpop").addEventListener("keydown", function (ev) { if (ev.key === "Escape") { ev.preventDefault(); closeMail(); } });
  $("mpop-f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var to = rcpChosen(), wk = formatWeek(current), b = $("mp-send");
    if (!to.length) return;
    b.disabled = true; $("mp-cancel").disabled = true; $("mpop-err").textContent = ""; $("mpop-msg").textContent = "Invio…";
    function done() { b.disabled = false; $("mp-cancel").disabled = false; syncSend(); }
    api("/api/email-collaudo", { method: "POST", body: JSON.stringify({ week: wk, to: to }) }).then(function (r) {
      done();
      if (r.status === 200 && r.body) {
        var sent = Array.isArray(r.body.sent_to) ? r.body.sent_to : to;
        $("mpop-msg").textContent = "Inviato a " + sent.join(", ") + ".";
        setMsg("Collaudo " + wk + " inviato a " + sent.length + " destinatari.");
        $("email").title = "Ultimo invio (" + wk + "): " + sent.join(", ");
        setTimeout(closeMail, 1800);
      } else { $("mpop-msg").textContent = ""; $("mpop-err").textContent = errText(r); }
    }, function (e) {
      done(); $("mpop-msg").textContent = "";
      if (e.kind === "auth") { closeMail(); authLost(); return; }
      $("mpop-err").textContent = e.message;
    });
  });
  function loadMailRights() {
    $("email").hidden = true;
    api("/api/email-recipients").then(function (r) {
      if (r.status !== 200 || !r.body || !r.body.allowed) return;
      mail.suggested = (r.body.suggested || []).filter(isEmail);
      $("email").hidden = false;
    }, function () { /* no e-mail button when the check fails */ });
  }

  requireLogin(function () {
    $("tools").hidden = false;
    syncTop();
    mountPassword($("hright")); mountLogout($("hright"));
    loadMailRights();
    var w = parseWeek(new URLSearchParams(location.search).get("week") || "") || isoWeekOf(todayNewYork());
    load(w);
  });
  document.addEventListener("rainyc:auth-lost", function () { $("doc").innerHTML = ""; loadedOnce = false; $("tools").hidden = true; closeTrip(false); $("mpop").hidden = true; });
})();
</script>
</body>
</html>
